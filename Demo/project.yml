# Generates CandleKitDemo.xcodeproj. Run `xcodegen generate` after changing this file.
name: CandleKitDemo

options:
  bundleIdPrefix: com.lalanachami
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  CandleKit:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CandleKitDemo:
    type: application
    platform: iOS
    sources:
      - path: CandleKitDemo
    dependencies:
      - package: CandleKit
        product: CandleKit
    settings:
      base:
        PRODUCT_NAME: CandleKitDemo
        PRODUCT_BUNDLE_IDENTIFIER: com.lalanachami.CandleKitDemo
        INFOPLIST_FILE: Support/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme: {}
